[package]
name = "sanzu-common"
version = "0.2.4"
authors = ["Fabrice Desclaux <fabrice.desclaux@cea.fr>"]
edition = "2018"
description = "Sanzu helper code"

[build-dependencies]
# pam-sys disables Bindgen's defaults; force its runtime loader in the unified
# build graph so libclang is loaded before PAM bindings are generated.
bindgen = { version = "=0.69.5", default-features = false, features = ["runtime"] }
prost-build = "0.11"

[dependencies]
anyhow = "1.0"
byteorder = "1.4"
env_logger = "0.10"
log = "0.4"
prost = "0.11"
rustls = "0.21"
rustls-pemfile = "1.0"
webpki-roots = "0.23"
x509-parser = "0.15"

[features]
kerberos = ["libgssapi"]
default = []

[target.'cfg(windows)'.dependencies]
winapi = "0.3"


[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.6", optional = true }
pam = {git = "https://github.com/serpilliere/pam.git", branch="fix_env_parsing"}
