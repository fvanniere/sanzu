stages:
  - package
  - publish

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  DEBIAN_PACKAGE_DIR: dist/debian-trixie
  GENERIC_PACKAGE_NAME: sanzu-debian-trixie

package:debian:trixie:
  stage: package
  image: rust:1-trixie
  # apt-get, cargo install and cargo deb download from the internet
  tags:
    - online
  cache:
    key: cargo-debian-trixie-rust-1-cargo-deb-2.9.2
    paths:
      - .cargo/bin/
      - .cargo/git/db/
      - .cargo/registry/cache/
      - .cargo/registry/index/
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates clang cmake dpkg-dev ffmpeg g++ git libasound2-dev
      libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev
      libclang-dev libdbus-1-dev libkrb5-dev libpam0g-dev libx264-dev
      libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      libxdamage-dev libxext-dev pkg-config protobuf-compiler
    - rm -rf /var/lib/apt/lists/*
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - cargo deb --version >/dev/null 2>&1 || cargo install cargo-deb --version 2.9.2 --locked
  script:
    - mkdir -p "${DEBIAN_PACKAGE_DIR}"
    # Each build of main is published and installed automatically: it needs
    # its own, increasing Debian revision (1+git<pipeline iid> sorts after the
    # -1 of the release and after the previous build of main). Release tags
    # keep -1.
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        DEB_REVISION="1"
      else
        DEB_REVISION="1+git${CI_PIPELINE_IID}"
      fi
      echo "Debian revision: ${DEB_REVISION}"
      echo "DEB_REVISION=${DEB_REVISION}" > deb-revision.env
    - cargo deb --locked -p sanzu --deb-revision "${DEB_REVISION}"
    - cargo deb --locked -p sanzu --variant=client --deb-revision "${DEB_REVISION}"
    - cargo deb --locked -p sanzu_broker --deb-revision "${DEB_REVISION}"
    - cargo deb --locked -p sanzu-web --deb-revision "${DEB_REVISION}"
    - cp target/debian/*.deb "${DEBIAN_PACKAGE_DIR}/"
    - test "$(find "${DEBIAN_PACKAGE_DIR}" -maxdepth 1 -name '*.deb' | wc -l)" -eq 4
    - for package in "${DEBIAN_PACKAGE_DIR}"/*.deb; do dpkg-deb --info "${package}" >/dev/null; done
    - find "${DEBIAN_PACKAGE_DIR}" -maxdepth 1 -name '*.deb' -print
  artifacts:
    name: "sanzu-debian-trixie-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/debian-trixie/*.deb
    reports:
      dotenv: deb-revision.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^sanzu-v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:debian:trixie:
  stage: publish
  image:
    name: debian:trixie
    entrypoint: [""]
  needs:
    - job: package:debian:trixie
      artifacts: true
  before_script:
    # debian:trixie n'a pas curl : l'envoi vers le registry en a besoin.
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends ca-certificates curl >/dev/null
  script:
    - PACKAGE_VERSION="$(awk -F'"' '/^version = / { print $2; exit }' sanzu/Cargo.toml)"
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        test "${CI_COMMIT_TAG}" = "sanzu-v${PACKAGE_VERSION}"
        test "${DEB_REVISION}" = "1"
        REGISTRY_VERSION="${PACKAGE_VERSION}"
      else
        test "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}"
        test "${DEB_REVISION}" = "1+git${CI_PIPELINE_IID}"
        # Same version as the Debian packages it holds, never reused.
        REGISTRY_VERSION="${PACKAGE_VERSION}-${DEB_REVISION}"
      fi
      export REGISTRY_VERSION
    - |
      for package in "${DEBIAN_PACKAGE_DIR}"/*.deb; do
        filename="$(basename "${package}")"
        curl --fail-with-body --location \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${package}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${GENERIC_PACKAGE_NAME}/${REGISTRY_VERSION}/${filename}"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^sanzu-v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
