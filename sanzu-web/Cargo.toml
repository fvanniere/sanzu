[package]
name = "sanzu-web"
version = "0.2.13"
authors = ["Fabrice Desclaux <fabrice.desclaux@cea.fr>"]
edition = "2018"
readme = "README.md"
description = "Web gateway for sanzu video server: the sanzu client in a browser"
license = "GPL-3.0"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
clap = { version = "4.3", features = ["derive"] }
env_logger = "0.10"
getrandom = "0.2"
httparse = "1.8"
log = "0.4"
# pam-sys disables Bindgen's defaults; keep the same PAM crate as sanzu-common
pam = {git = "https://github.com/serpilliere/pam.git", branch="fix_env_parsing"}
sanzu-common = { path="../sanzu-common", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.7"
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
ureq = { version = "2.9", features = ["json", "native-certs"] }
url = "2.4"
uuid = { version = "1.3", features = ["v4"] }
